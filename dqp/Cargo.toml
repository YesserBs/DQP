[package]
name = "dqp"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
description = "Deterministic compiler and runtime for Diverging Questions Protocol"
license = "MIT"

[dependencies]
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
serde_path_to_error = "=0.1.16"
sha2 = "=0.10.8"
clap = { version = "=4.4.18", features = ["derive"] }
tempfile = "=3.15.0"
ctrlc = "=3.4.5"
